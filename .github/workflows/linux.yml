name: Linux Build
on:
  push:
    branches: ["main"]
    paths: &workflow_paths
      - "**.cpp"
      - "**.hpp"
      - "**.c"
      - "**.h"
      - "**/meson.build"
      - ".github/workflows/linux.yml"

  pull_request:
    paths: *workflow_paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'dev/') }}

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache python3 python3-pip ninja-build libx11-dev meson

      - name: Compile
        run: |
          meson setup build
          meson compile -C build
